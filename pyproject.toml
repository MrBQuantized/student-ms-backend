[project]
name = "student-ms-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OnohLabs", email = "onohblessing24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.142.2",
    "passlib[bcrypt]>=1.7.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "sqlmodel>=0.0.47",
    "swagger-ui-bundle>=1.1.0",
]

[project.scripts]
api = "app.main:app"
dev = "app.cli:dev"

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "djlint>=1.46.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/routers"]

[tool.djlint]
profile = "jinja"
indent = 4
max_line_length = 100