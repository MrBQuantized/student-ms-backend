<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            {% if title %} Student Management System - {{ title }} {% else %} Student
                Management System {% endif %}
        </title>
        <!-- CSS (Base, Layout, Components)-->
        <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}" />
        <link rel="stylesheet"
              href="{{ url_for('static', path='/css/components.css') }}" />
        <link rel="stylesheet"
              href="{{ url_for('static', path='/css/layout.css') }}" />
        <!-- CSS (Pages) -->
        <link rel="stylesheet"
              href="{{ url_for('static', path='/css/pages/dashboard.css') }}" />
    </head>
    <body>
        <div class="app">
            <!-- ========== SIDEBAR ========== -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <a href="/" class="logo">
                        <span class="logo-icon">♦</span>
                        <span class="logo-text">StudentMS</span>
                    </a>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <nav class="side-nav">
                    <a href="{{ url_for("home") }}" class="nav-item active">
                        <svg class="icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        <span class="icon">Home</span></a>
                    <a href="{{ url_for("dashboard") }}" class="nav-item">
                        <svg class="icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="9" />
                            <rect x="14" y="3" width="7" height="5" />
                            <rect x="14" y="12" width="7" height="9" />
                            <rect x="3" y="16" width="7" height="5" />
                        </svg>
                        <span class="icon">Dashboard</span></a>
                    <a href="{{ url_for("students") }}" class="nav-item">
                        <svg class="icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                        <span class="icon">Students</span></a>
                    <a href="{{ url_for("departments") }}" class="nav-item">
                        <svg class="icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <rect x="9" y="2" width="6" height="5" rx="1" />
                            <rect x="2" y="17" width="6" height="5" rx="1" />
                            <rect x="9" y="17" width="6" height="5" rx="1" />
                            <rect x="16" y="17" width="6" height="5" rx="1" />
                            <path d="M12 7v3" />
                            <path d="M5 17v-2h14v2" />
                            <path d="M12 10v5" />
                        </svg>
                        <span class="icon">Departments</span></a>
                    <a href="{{ url_for("courses") }}" class="nav-item">
                        <svg class="icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                        </svg>
                        <span class="icon">Courses</span></a>
                    <a href="{{ url_for("grades") }}" class="nav-item">
                        <svg class="icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                            <polyline points="22 4 12 14.01 9 11.01" />
                        </svg>
                        <span class="icon">Grades</span></a>
                    <a href="{{ url_for("enrollments") }}" class="nav-item">
                        <svg class="icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 24 24h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <line x1="9" y1="15" x2="15" y2="15" />
                        </svg>
                        <span class="icon">Enrollments</span></a>
                    <a href="{{ url_for("reports") }}" class="nav-item">
                        <svg class="icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10" />
                            <line x1="12" y1="20" x2="12" y2="4" />
                            <line x1="6" y1="20" x2="6" y2="14" />
                        </svg>
                        <span class="icon">Reports</span></a>
                </nav>
                <div class="user-card">
                    <div class="avatar">OB</div>
                    <div class="user-content">
                        <div class="user-name">Blessing</div>
                        <div class="user-meta">Admin</div>
                    </div>
                </div>
            </aside>
            <!-- ========== MAIN ========== -->
            <div class="main-area">
                <!-- Topbar -->
                <header class="topbar">
                    <div class="topbar-left">
                        <button class="menu-btn" id="menuBtn" aria-label="Open sidebar">
                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 stroke-linecap="round">
                                <line x1="3" y1="6" x2="21" y2="6" />
                                <line x1="3" y1="12" x2="21" y2="12" />
                                <line x1="3" y1="18" x2="21" y2="18" />
                            </svg>
                            <!-- ☰ -->
                        </button>
                        <h2 class="page-title" id="pageTitle">Home</h2>
                    </div>
                    <div class="topbar-right">
                        <span class="pill">2025/26 Session</span>
                        <!-- Theme Toggle -->
                        <div class="theme-control">
                            <button class="icon-btn"
                                    id="themeToggle"
                                    type="button"
                                    aria-label="Theme settings"
                                    aria-haspopup="true"
                                    aria-expanded="false">
                                <svg class="sun"
                                     viewBox="0 0 24 24"
                                     aria-hidden="true"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round">
                                    <circle cx="12" cy="12" r="5" />
                                    <line x1="12" y1="1" x2="12" y2="3" />
                                    <line x1="12" y1="21" x2="12" y2="23" />
                                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                                    <line x1="1" y1="12" x2="3" y2="12" />
                                    <line x1="21" y1="12" x2="23" y2="12" />
                                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                                </svg>
                                <svg class="moon"
                                     viewBox="0 0 24 24"
                                     aria-hidden="true"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round">
                                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                                </svg>
                            </button>
                            <div class="theme-menu" id="themeMenu" hidden>
                                <button type="button" data-theme-choice="light">Light</button>
                                <button type="button" data-theme-choice="dark">Dark</button>
                                <button type="button" data-theme-choice="auto">Auto</button>
                            </div>
                        </div>
                        <button class="btn btn-outline">Login</button>
                        <button class="btn btn-primary">Sign Up</button>
                    </div>
                </header>
                <!-- Content -->
                <main class="content">
                    {% block content %}
                    {% endblock content %}
                </main>
            </div>
            <!-- Scripts -->
            <script type="module" src="{{ url_for('static', path='/js/utils.js') }}"></script>
            <script type="module" src="{{ url_for('static', path='/js/script.js') }}"></script>
            <script type="module" src="{{ url_for('static', path='/js/theme.js') }}"></script>
        </div>
    </body>
</html>
